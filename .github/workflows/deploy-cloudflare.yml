name: Deploy GymFlow to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gymflow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate D1, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GymFlow-Cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GymFlow-Cloudflare/package-lock.json

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run lint and tests
        run: |
          npm run lint
          npm test

      - name: Apply archive migration when needed
        shell: bash
        run: |
          schema_json="$(
            npx wrangler d1 execute gymflow-db \
              --remote \
              --json \
              --command "PRAGMA table_info(weeks);"
          )"

          if jq -e '.. | objects | select(.name? == "archived")' \
            >/dev/null <<<"${schema_json}"; then
            echo "Archive migration already applied."
          else
            npx wrangler d1 execute gymflow-db \
              --remote \
              --file drizzle/0007_week_archive.sql
          fi

      - name: Deploy Worker
        run: npx wrangler deploy
