name: Deploy GymFlow to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gymflow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate D1, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GymFlow-Cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GymFlow-Cloudflare/package-lock.json

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Resolve gymflow-db
        shell: bash
        run: |
          databases_file="$(mktemp)"
          npx wrangler d1 list --json >"${databases_file}"

          database_id="$(
            jq -r '
              .. | objects
              | select(.name? == "gymflow-db")
              | (.uuid // .id // .database_id // empty)
            ' "${databases_file}" | head -n 1
          )"

          if [[ -z "${database_id}" ]]; then
            echo "::error::The authorized Cloudflare account does not contain a D1 database named gymflow-db."
            jq -r '.. | objects | .name? // empty' "${databases_file}" | sort -u
            exit 1
          fi

          echo "GYMFLOW_DATABASE_ID=${database_id}" >>"${GITHUB_ENV}"

      - name: Run lint and tests
        run: |
          npm run lint
          npm test

      - name: Apply database migrations when needed
        shell: bash
        run: |
          schema_file="$(mktemp)"
          if ! npx wrangler d1 execute gymflow-db \
            --remote \
            --json \
            --command "PRAGMA table_info(weeks);" \
            >"${schema_file}"; then
            echo "::error::Unable to inspect the gymflow-db schema."
            cat "${schema_file}"
            exit 1
          fi

          cat "${schema_file}"
          if jq -e '.. | objects | select(.name? == "archived")' \
            >/dev/null "${schema_file}"; then
            echo "Archive migration already applied."
          else
            npx wrangler d1 execute gymflow-db \
              --remote \
              --file drizzle/0007_week_archive.sql
          fi

          plans_schema_file="$(mktemp)"
          npx wrangler d1 execute gymflow-db \
            --remote \
            --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'workout_plans';" \
            >"${plans_schema_file}"
          if jq -e '.. | objects | select(.name? == "workout_plans")' \
            >/dev/null "${plans_schema_file}"; then
            echo "Workout plan migration already applied."
          else
            npx wrangler d1 execute gymflow-db \
              --remote \
              --file drizzle/0008_workout_plans.sql
          fi

          workouts_schema_file="$(mktemp)"
          npx wrangler d1 execute gymflow-db \
            --remote \
            --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'workouts';" \
            >"${workouts_schema_file}"
          if jq -e '.. | objects | select(.name? == "workouts")' \
            >/dev/null "${workouts_schema_file}"; then
            echo "Week workouts migration already applied."
          else
            npx wrangler d1 execute gymflow-db \
              --remote \
              --file drizzle/0009_week_workouts.sql
          fi

          workout_columns_file="$(mktemp)"
          npx wrangler d1 execute gymflow-db \
            --remote \
            --json \
            --command "PRAGMA table_info(workouts);" \
            >"${workout_columns_file}"
          if jq -e '.. | objects | select(.name? == "completed")' \
            >/dev/null "${workout_columns_file}"; then
            echo "Workout completion migration already applied."
          else
            npx wrangler d1 execute gymflow-db \
              --remote \
              --file drizzle/0010_workout_completed.sql
          fi

          exercise_columns_file="$(mktemp)"
          npx wrangler d1 execute gymflow-db \
            --remote \
            --json \
            --command "PRAGMA table_info(exercises);" \
            >"${exercise_columns_file}"
          if jq -e '.. | objects | select(.name? == "recovery_seconds")' \
            >/dev/null "${exercise_columns_file}"; then
            echo "Exercise recovery migration already applied."
          else
            npx wrangler d1 execute gymflow-db \
              --remote \
              --file drizzle/0011_exercise_recovery.sql
          fi

      - name: Deploy Worker
        run: npx wrangler deploy
